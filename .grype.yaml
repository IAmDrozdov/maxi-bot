# Run by deploy.sh's preflight; by hand: grype dir:. --only-fixed
fail-on-severity: high
exclude:
  - ./.venv/**
  - ./.git/**
  # Terraform provider binary (local tooling, never deployed).
  - ./infrastructure/terraform/.terraform/**
  # Never shipped (deploy.sh rsync excludes them); agent worktrees there carry their own uv.lock.
  - ./.claude/**
  - ./.local/**
  - ./.scratch/**
ignore:
  # Name collision: the root project "maxi-bot" is not PyPI's aiwaves-cn "agents".
  - vulnerability: GHSA-ch88-c67q-65r9
